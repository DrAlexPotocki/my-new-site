<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 320 340"
     width="320"
     height="340"
     role="img"
     aria-label="Латеральне згинання голови">

  <style>
    .head-neck {
      transform-box: view-box;
      transform-origin: 160px 190px;
      animation: lateral-flexion 14s infinite;
    }

    .effort-left,
    .effort-right {
      opacity: 0;
    }

    .effort-left {
      animation: effort-left 14s infinite;
    }

    .effort-right {
      animation: effort-right 14s infinite;
    }

    @keyframes lateral-flexion {
      0%, 50%, 100% {
        transform: rotate(0deg);
      }

      14.285%,
      21.428%,
      28.571% {
        transform: rotate(17deg);
      }

      64.285%,
      71.428%,
      78.571% {
        transform: rotate(-17deg);
      }

      42.857%,
      92.857% {
        transform: rotate(0deg);
      }
    }

    @keyframes effort-left {
      0%, 21.428% {
        opacity: 0;
      }
      23%, 28.571% {
        opacity: 1;
      }
      30%, 100% {
        opacity: 0;
      }
    }

    @keyframes effort-right {
      0%, 71.428% {
        opacity: 0;
      }
      73%, 78.571% {
        opacity: 1;
      }
      80%, 100% {
        opacity: 0;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .head-neck {
        animation: none;
      }
      .effort-left,
      .effort-right {
        animation: none;
        opacity: 0;
      }
    }
  </style>

  <g fill="none"
     stroke="#182522"
     stroke-width="4"
     stroke-linecap="round"
     stroke-linejoin="round">

    <!-- Тулуб -->
    <path d="
      M 160 190
      L 160 215
      C 145 215 125 220 108 229
      C 91 239 82 260 76 290
      L 62 340
      M 160 215
      C 175 215 195 220 212 229
      C 229 239 238 260 244 290
      L 258 340
    "/>

    <!-- Плечі та грудна клітка -->
    <path d="
      M 108 229
      C 121 239 137 243 160 243
      C 183 243 199 239 212 229
    "/>

    <!-- Центр грудної клітки -->
    <path d="M 160 245 L 160 340"
          stroke-width="2.5"/>

    <!-- Ключиці -->
    <path d="
      M 160 218
      C 142 224 126 225 111 229
      M 160 218
      C 178 224 194 225 209 229
    " stroke-width="2.5"/>

  </g>

  <!-- Шия і голова -->
  <g class="head-neck">

    <!-- Шия -->
    <path d="
      M 139 122
      C 141 146 139 166 132 190
      L 188 190
      C 181 166 179 146 181 122
    "
    fill="#F4F5F3"
    stroke="#182522"
    stroke-width="3.5"
    stroke-linejoin="round"/>

    <!-- Контур голови -->
    <path d="
      M 112 69
      C 112 35 132 18 160 18
      C 189 18 208 39 208 72
      C 208 94 200 113 187 128
      C 179 137 171 143 160 145
      C 149 143 141 137 133 128
      C 120 113 112 94 112 69
      Z
    "
    fill="#F4F5F3"
    stroke="#182522"
    stroke-width="3.5"/>

    <!-- Волосся -->
    <path d="
      M 112 76
      C 104 54 111 29 128 17
      C 145 4 178 6 195 20
      C 210 32 214 54 207 75
      C 201 60 195 49 182 43
      C 168 51 143 53 126 47
      C 123 58 119 68 112 76
      Z
    "
    fill="#182522"/>

    <!-- Вуха -->
    <path d="
      M 111 76
      C 98 66 98 89 113 96
      M 209 76
      C 222 66 222 89 207 96
    "
    fill="#F4F5F3"
    stroke="#182522"
    stroke-width="2.5"/>

    <!-- Брови -->
    <path d="
      M 133 79 Q 144 73 153 79
      M 168 79 Q 180 73 188 79
    "
    stroke="#182522"
    stroke-width="2.5"
    fill="none"/>

    <!-- Очі -->
    <path d="
      M 137 87 L 149 87
      M 172 87 L 184 87
    "
    stroke="#182522"
    stroke-width="3"
    stroke-linecap="round"/>

    <!-- Ніс -->
    <path d="
      M 160 86
      L 157 103
      Q 160 107 164 104
    "
    stroke="#182522"
    stroke-width="2"
    fill="none"/>

    <!-- Рот -->
    <path d="
      M 150 119 Q 160 123 170 119
    "
    stroke="#182522"
    stroke-width="2"
    fill="none"/>

    <!-- Лінії шиї -->
    <path d="
      M 143 145 Q 151 164 146 187
      M 177 145 Q 169 164 174 187
    "
    stroke="#A0AAA5"
    stroke-width="2"
    fill="none"/>

  </g>

  <!-- Індикація ізометричного напруження -->
  <path class="effort-left"
        d="M 133 153 Q 119 165 119 183"
        stroke="#176B63"
        stroke-width="5"
        stroke-linecap="round"
        fill="none"/>

  <path class="effort-right"
        d="M 187 153 Q 201 165 201 183"
        stroke="#176B63"
        stroke-width="5"
        stroke-linecap="round"
        fill="none"/>

</svg>